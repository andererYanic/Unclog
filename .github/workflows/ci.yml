name: ci
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-deu
      - run: pip install -e ".[dev,llm,ingest,reports,security]"
      - run: ruff check .
      - run: pytest
      - run: unclog security-scan .
      - run: unclog eval-cases
