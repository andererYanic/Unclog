[project]
name = "unclog"
version = "0.1.0"
description = "Constraint-first AI consulting and delivery agent organization"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
]

[project.optional-dependencies]
llm = ["anthropic>=0.70"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
unclog-export-schemas = "unclog.schemas.export:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/unclog"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/unclog/schemas/__init__.py" = ["F401"]  # re-export hub; __all__ is computed
